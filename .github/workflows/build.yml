# Build and test on every push and pull request, and keep the packaged exes as an artifact so a
# branch can be tried without a local toolchain.
#
# windows-latest is not a preference, it is a requirement: the bridge targets .NET Framework 4.8
# and the desktop app targets net10.0-windows with WPF. Neither builds on a Linux runner.
name: build

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]      # a version tag is the release workflow's job, not this one
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same branch makes the previous run's answer irrelevant.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # global.json pins 10.0.400 with rollForward latestMinor.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TiaOpenness.slnx

      - name: Build
        run: dotnet build TiaOpenness.slnx -c Release --no-restore

      # The GUI tests drive real WPF on a dedicated STA thread and render the main window, which
      # works on the hosted Windows runner without a desktop session.
      - name: Test
        run: dotnet test TiaOpenness.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

      - name: Package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/publish.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: TiaOpennessStudio-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          retention-days: 14
