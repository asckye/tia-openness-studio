# Cut a release from a version tag: test, package, and publish the zip as a GitHub release.
#
#   git tag -a v1.1.0 -m "..." && git push origin v1.1.0
#
# The tag is the trigger and the single source of the version: the job refuses to run if the tag
# does not match <Version> in Directory.Build.props, because a zip whose name disagrees with the
# exe inside it is worse than no zip at all.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.1.0"
        required: true

permissions:
  contents: write      # needed to create the release and upload its assets

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve and verify the version
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { "${{ github.ref_name }}" }
          $version = $tag.TrimStart('v')

          $declared = [regex]::Match(
            (Get-Content Directory.Build.props -Raw), '<Version>([^<]+)</Version>').Groups[1].Value.Trim()

          if ($declared -ne $version) {
            throw "Tag $tag says $version but Directory.Build.props says $declared. Bump one of them."
          }

          "tag=$tag"         | Out-File -Append $env:GITHUB_OUTPUT
          "version=$version" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "Releasing $tag (version $version)"
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}

      - name: Build
        run: dotnet build TiaOpenness.slnx -c Release

      # A release that fails its own tests is not a release.
      - name: Test
        run: dotnet test TiaOpenness.slnx -c Release --no-build

      - name: Package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/publish.ps1

      # The artifact is one file that unpacks a bridge, a compiler and the adapter sources on
      # first run. Copying it somewhere empty and driving it over MCP proves all of that survived
      # the single-file publish - a release whose payload is broken looks fine until someone runs it.
      - name: Smoke-test the executable on its own
        shell: pwsh
        run: |
          $exe = Get-ChildItem artifacts -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "publish.ps1 produced no executable." }

          $solo = Join-Path $env:RUNNER_TEMP "solo"
          New-Item -ItemType Directory -Force -Path $solo | Out-Null
          Copy-Item $exe.FullName (Join-Path $solo "TiaOpenness.exe")

          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"tia_connect","arguments":{}}}'
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"tia_open_project","arguments":{"path":"D:/demo/Line.ap21"}}}'
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"tia_list_devices","arguments":{}}}'
          ) -join "`n"

          $reply = $requests | & (Join-Path $solo "TiaOpenness.exe") mcp --mock 2>$null
          if ($reply -notmatch 'PLC_1') {
            throw "The executable did not answer over MCP from an empty folder. Output:`n$reply"
          }
          Write-Host "OK: one file, unpacked its own bridge and served a project over MCP."

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TIA Openness Studio ${{ steps.version.outputs.tag }}
          body: |
            ## One file

            Download `TiaOpenness-${{ steps.version.outputs.tag }}-win-x64.exe` and run it. Nothing
            to unzip, nothing to install — the .NET runtime is inside it.

            - double-click, or `TiaOpenness.exe --mock` → the desktop app
            - `TiaOpenness.exe mcp [--allow-write]` → the MCP server, for Claude / Cursor / VS Code

            ## Connecting to a real TIA Portal — press "Enable Openness" once

            The Openness adapter **cannot ship prebuilt**. It has to be compiled against the
            `Siemens.Engineering` assemblies, and Siemens does not permit redistributing those, so
            no build machine without TIA Portal — this CI included — can produce it.

            On the machine that has TIA Portal, press **Enable Openness** in the header. It finds
            your installation, compiles the adapter that is carried inside the executable, and the
            next **Connect** uses it. A C# compiler is bundled, so **no .NET SDK, no Visual Studio
            and no source clone are needed**, and there is no restart.

            If it reports compile errors, each names a file and line in the adapter sources: this
            build expects an Openness API your TIA version does not have. Those errors are the bug
            report — please open an issue with them.

            Until that step is done, anything needing a live project fails with a message saying so.
            It never silently falls back to the synthetic project.

            Supports TIA Portal V15.1 – V21, including V21's modular assembly layout.
            See [docs/deployment.md](https://github.com/asckye/tia-openness-studio/blob/main/docs/deployment.md).
          # The commit list is appended under the notes above rather than hand-maintained here.
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/*.exe
            artifacts/*.sha256
